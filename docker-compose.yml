version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agloval_postgres
    environment:
      POSTGRES_DB: agloval_db
      POSTGRES_USER: agloval_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agloval_user -d agloval_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: agloval_app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agloval_db
      SPRING_DATASOURCE_USERNAME: agloval_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
