version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: quotation_postgres
    environment:
      POSTGRES_DB: quotation_db
      POSTGRES_USER: quotation_user
      POSTGRES_PASSWORD: quotation_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotation_user -d quotation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: